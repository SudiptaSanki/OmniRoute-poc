<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniRoute — Free AI Gateway for Multi-Provider LLMs</title>
    <meta name="description" content="Free, open-source AI router with auto-fallback. 268 providers, one endpoint, 95 MCP tools, 18 routing strategies. Never hit limits — never stop building." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen antialiased bg-slate-50 text-slate-900 dark:bg-[#0b0e14] dark:text-slate-100 font-sans transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <div id="google_translate_container" style="display:none; position:fixed; top:80px; right:20px; z-index:9999; background: white; padding: 5px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
      <div id="google_translate_element"></div>
    </div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
      }
      window.triggerTranslate = function(lang) {
         var combo = document.querySelector('.goog-te-combo');
         if(combo) {
             combo.value = lang;
             combo.dispatchEvent(new Event('change'));
         }
      };
      window.toggleTranslateWidget = function() {
         var el = document.getElementById('google_translate_container');
         if(el.style.display === 'none') {
             el.style.display = 'block';
         } else {
             el.style.display = 'none';
         }
      };
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
